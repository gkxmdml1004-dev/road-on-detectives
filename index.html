function renderCompare(){app.innerHTML=`<h1>비교 탐구하기</h1><p class="sub">교통수단 두 가지를 골라 특징을 나란히 살펴봅시다. (${selected.length}/2)</p><div class="compare-grid" style="margin-top:20px">${[1,2,4,0,3,5].map(i=>visible[i]?card(i,'choose'):'').join('')}</div><section class="panel">${selected.length===2?`<div class="pair compare-pictures">${selected.map(i=>`<div><h2>${names[i]}</h2><button class="picture-button" onclick="zoom(${i})">${art(i)}</button></div>`).join('')}</div>${comparisonTable()}<div class="questions"><p>어떤 점이 비슷한가요? 어떤 점이 다른가요?</p></div><details class="compare-more"><summary>더 궁금하면 탐구해 봅시다</summary><div class="controls">${selected.map(i=>`<button class="btn" onclick="explore(${i})">${names[i]} 자료 탐구하기 →</button>`).join('')}</div></details>`:'<div class="empty"><p>'+ (selected.length===1?selected.map(i=>names[i]).join('')+'와 비교할 교통수단을 하나 더 골라 주세요.':'위에서 교통수단 두 가지를 골라 주세요.')+'</p></div>'}</section><details class="panel compare-grouping"><summary>우리만의 기준으로 묶어 보기</summary><div class="label">우리만의 기준으로</div><h2>어떤 기준으로 묶을 수 있을까요?</h2><p class="sub">기준 이름을 정하고 카드를 묶어 보세요. 같은 교통수단이 여러 묶음에 들어가도 괜찮아요.</p><div class="controls"><input id="groupName" maxlength="40" placeholder="우리 모둠의 기준 이름" aria-label="묶음 기준 이름"><button class="btn primary" onclick="addGroup()">묶음 만들기 ＋</button></div><p class="hint">아래 이름을 누른 뒤 묶음을 누르거나, 이름을 묶음으로 끌어 놓으세요.</p><div>${names.map((n,i)=>visible[i]?`<button class="chip ${activeCard===i?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')" onclick="activeCard=${i};renderCompare()" aria-pressed="${activeCard===i}">${n}</button>`:'').join('')}</div><div class="groups" style="margin-top:20px">${groups.map((g,j)=>`<div class="group" ondragover="event.preventDefault()" ondrop="dropCard(event,${j})"><h3>${esc(g.name)} <button class="remove" aria-label="묶음 삭제" onclick="groups.splice(${j},1);renderCompare()">×</button></h3><button class="btn" onclick="put(${j},activeCard)">${activeCard===null?'교통수단을 먼저 골라요':names[acti function addGroup(){let input=document.querySelector('#groupName'),n=input.value.trim();if(!n){input.focus();return}groups.push({name:n,items:[]});renderCompare()}
function put(j,i){if(i===null||!Number.isInteger(i)||!visible[i])return;if(!groups[j].items.includes(i))groups[j].items.push(i);renderCompare()}
function dropCard(e,j){e.preventDefault();let s=e.dataTransfer.getData('text/plain');if(!/^\d$/.test(s))return;put(j,Number(s))}
